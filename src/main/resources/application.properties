spring.application.name=flash-sale-engine

# Docker Compose - disabled because containers are managed externally (docker compose up -d)
# Spring Boot's TCP readiness check fails on Windows Docker networking
spring.docker.compose.enabled=false

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=flashuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Virtual Threads (Project Loom) - handles 1M+ connections without thread exhaustion
spring.threads.virtual.enabled=true

# Server Configuration (tuned for extreme concurrency)
server.port=8080
server.tomcat.max-connections=50000
server.tomcat.accept-count=10000
server.tomcat.connection-timeout=10000

# Database Connection Pool (minimal - DB load is low in v2)
# Redis handles the hot path; DB only receives ~100 order writes
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=200
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=20
spring.data.redis.lettuce.pool.max-wait=3000

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Logging (reduced for performance)
logging.level.com.example.flash_sale_engine=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Flash Sale Configuration
flash-sale.rate-limit.requests-per-second=5
flash-sale.rate-limit.global-requests-per-second=50000
flash-sale.default-stock=10000
