spring.application.name=flash-sale-engine

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=flashuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration (Increased for extreme load)
server.port=8080
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=2000
server.tomcat.connection-timeout=60000

# Database Connection Pool (Optimized for high concurrency)
# Increased pool size to handle concurrent requests better
# Note: Each connection can handle multiple transactions via connection pooling
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# Reduce validation query overhead
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Performance (optimized for high concurrency)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Optimize for high concurrency - reduce lock contention
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Use read-committed isolation for better concurrency (default, but explicit)
spring.transaction.default-isolation=read-committed

# Logging (reduced for performance under load)
logging.level.com.example.flash_sale_engine=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
