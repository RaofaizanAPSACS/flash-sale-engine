spring.application.name=flash-sale-engine

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=flashuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server - standard defaults
server.port=8080

# HikariCP connection pool - standard defaults
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Database query timeout (5 seconds - matches transaction timeout)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.javax.persistence.query.timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# Logging
logging.level.com.example.flash_sale_engine=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
