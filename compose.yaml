services:
  postgres:
    image: 'postgres:16'
    container_name: flash-sale-postgres
    environment:
      - 'POSTGRES_DB=flashsale'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=flashuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
