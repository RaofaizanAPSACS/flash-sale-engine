<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Flash Sale Engine - Load Test Comparison</text>
  <text x="450" y="66" text-anchor="middle" fill="#8888aa" font-size="13">v1 (Standard) vs v2 (Redis Optimized) | 10,000 Concurrent Users | All 10k Stock Sold</text>

  <!-- Separator -->
  <line x1="40" y1="82" x2="860" y2="82" stroke="#333355" stroke-width="1"/>

  <!-- Config box -->
  <rect x="40" y="96" width="820" height="44" rx="6" fill="#16162a" stroke="#2a2a44" stroke-width="1"/>
  <text x="60" y="123" fill="#8888aa" font-size="12" font-weight="600">Test Config:</text>
  <text x="160" y="123" fill="#ccccdd" font-size="12">Peak VUs: 10,000</text>
  <text x="330" y="123" fill="#ccccdd" font-size="12">Hold: 35s at peak</text>
  <text x="490" y="123" fill="#ccccdd" font-size="12">Timeout: 10s</text>
  <text x="620" y="123" fill="#ccccdd" font-size="12">Stock: 10,000</text>
  <text x="760" y="123" fill="#ccccdd" font-size="12">Sleep: 0.05s</text>

  <!-- ==================== v1 Card ==================== -->
  <rect x="40" y="158" width="400" height="410" rx="10" fill="#1e1015" stroke="#5a2233" stroke-width="1.5"/>
  <rect x="40" y="158" width="400" height="42" rx="10" fill="#3a1525"/>
  <rect x="40" y="188" width="400" height="12" fill="#3a1525"/>
  <text x="240" y="185" text-anchor="middle" fill="#ff6b6b" font-size="18" font-weight="700">v1 Standard</text>

  <!-- v1: Total Requests -->
  <text x="66" y="228" fill="#aa8899" font-size="13">Total Requests</text>
  <text x="414" y="228" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">119,180</text>
  <line x1="66" y1="240" x2="414" y2="240" stroke="#2a1a22" stroke-width="1"/>

  <!-- v1: DB Confirmed -->
  <text x="66" y="264" fill="#aa8899" font-size="13">DB-Confirmed Purchases</text>
  <text x="414" y="264" text-anchor="end" fill="#66cc66" font-size="16" font-weight="700">10,000</text>
  <line x1="66" y1="276" x2="414" y2="276" stroke="#2a1a22" stroke-width="1"/>

  <!-- v1: k6 received 200 -->
  <text x="66" y="300" fill="#aa8899" font-size="13">k6 Received 200 in Time</text>
  <text x="414" y="300" text-anchor="end" fill="#ffaa44" font-size="16" font-weight="700">3,642 (3%)</text>
  <line x1="66" y1="312" x2="414" y2="312" stroke="#2a1a22" stroke-width="1"/>

  <!-- v1: Errors -->
  <text x="66" y="336" fill="#aa8899" font-size="13">Errors / Timeouts (k6)</text>
  <text x="414" y="336" text-anchor="end" fill="#ff6b6b" font-size="16" font-weight="700">115,538 (97%)</text>
  <line x1="66" y1="348" x2="414" y2="348" stroke="#2a1a22" stroke-width="1"/>

  <!-- v1: Avg Latency -->
  <text x="66" y="372" fill="#aa8899" font-size="13">Avg Latency</text>
  <text x="414" y="372" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">1,319 ms</text>
  <line x1="66" y1="384" x2="414" y2="384" stroke="#2a1a22" stroke-width="1"/>

  <!-- v1: P95 -->
  <text x="66" y="408" fill="#aa8899" font-size="13">P95 Latency</text>
  <text x="414" y="408" text-anchor="end" fill="#ff9999" font-size="16" font-weight="700">10,000 ms</text>
  <line x1="66" y1="420" x2="414" y2="420" stroke="#2a1a22" stroke-width="1"/>

  <!-- v1: Oversold -->
  <text x="66" y="444" fill="#aa8899" font-size="13">Oversold</text>
  <text x="414" y="444" text-anchor="end" fill="#66cc66" font-size="16" font-weight="700">NO</text>

  <!-- v1: Explanation -->
  <text x="240" y="476" text-anchor="middle" fill="#997788" font-size="10">~6,358 purchases succeeded on server but</text>
  <text x="240" y="490" text-anchor="middle" fill="#997788" font-size="10">k6 timed out before receiving the response</text>

  <!-- v1 Badge -->
  <rect x="120" y="504" width="240" height="40" rx="8" fill="#5a1a2a"/>
  <text x="240" y="531" text-anchor="middle" fill="#ff4444" font-size="20" font-weight="800">97% TIMEOUTS</text>

  <!-- ==================== v2 Card ==================== -->
  <rect x="460" y="158" width="400" height="410" rx="10" fill="#0a1e15" stroke="#1a5a33" stroke-width="1.5"/>
  <rect x="460" y="158" width="400" height="42" rx="10" fill="#0a3a20"/>
  <rect x="460" y="188" width="400" height="12" fill="#0a3a20"/>
  <text x="660" y="185" text-anchor="middle" fill="#44dd88" font-size="18" font-weight="700">v2 Optimized</text>

  <!-- v2: Total Requests -->
  <text x="486" y="228" fill="#77aa88" font-size="13">Total Requests</text>
  <text x="834" y="228" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">618,241</text>
  <line x1="486" y1="240" x2="834" y2="240" stroke="#0a2a1a" stroke-width="1"/>

  <!-- v2: DB Confirmed -->
  <text x="486" y="264" fill="#77aa88" font-size="13">DB-Confirmed Purchases</text>
  <text x="834" y="264" text-anchor="end" fill="#66cc66" font-size="16" font-weight="700">10,000</text>
  <line x1="486" y1="276" x2="834" y2="276" stroke="#0a2a1a" stroke-width="1"/>

  <!-- v2: Sold Out -->
  <text x="486" y="300" fill="#77aa88" font-size="13">Sold Out (409)</text>
  <text x="834" y="300" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">607,491 (98.3%)</text>
  <line x1="486" y1="312" x2="834" y2="312" stroke="#0a2a1a" stroke-width="1"/>

  <!-- v2: Errors -->
  <text x="486" y="336" fill="#77aa88" font-size="13">Errors / Timeouts (k6)</text>
  <text x="834" y="336" text-anchor="end" fill="#44dd88" font-size="16" font-weight="700">750 (0.12%)</text>
  <line x1="486" y1="348" x2="834" y2="348" stroke="#0a2a1a" stroke-width="1"/>

  <!-- v2: Avg Latency -->
  <text x="486" y="372" fill="#77aa88" font-size="13">Avg Latency</text>
  <text x="834" y="372" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">625 ms</text>
  <line x1="486" y1="384" x2="834" y2="384" stroke="#0a2a1a" stroke-width="1"/>

  <!-- v2: P95 -->
  <text x="486" y="408" fill="#77aa88" font-size="13">P95 Latency</text>
  <text x="834" y="408" text-anchor="end" fill="#88eebb" font-size="16" font-weight="700">1,786 ms</text>
  <line x1="486" y1="420" x2="834" y2="420" stroke="#0a2a1a" stroke-width="1"/>

  <!-- v2: Oversold -->
  <text x="486" y="444" fill="#77aa88" font-size="13">Oversold</text>
  <text x="834" y="444" text-anchor="end" fill="#66cc66" font-size="16" font-weight="700">NO</text>

  <!-- v2: Explanation -->
  <text x="660" y="476" text-anchor="middle" fill="#669977" font-size="10">All requests received instant HTTP response</text>
  <text x="660" y="490" text-anchor="middle" fill="#669977" font-size="10">Redis hot path + in-memory sold-out cache</text>

  <!-- v2 Badge -->
  <rect x="540" y="504" width="240" height="40" rx="8" fill="#0a4a28"/>
  <text x="660" y="531" text-anchor="middle" fill="#44ee88" font-size="20" font-weight="800">99.88% SUCCESS</text>

  <!-- ==================== Bottom bar ==================== -->
  <rect x="40" y="568" width="820" height="56" rx="8" fill="#16162a" stroke="#2a2a44" stroke-width="1"/>
  <text x="60" y="602" fill="#8888aa" font-size="13" font-weight="700">Improvement:</text>
  <text x="210" y="602" fill="#4499ff" font-size="16" font-weight="800">5.2x</text>
  <text x="260" y="602" fill="#8899bb" font-size="13">Throughput</text>
  <text x="390" y="602" fill="#44dd88" font-size="16" font-weight="800">99.3%</text>
  <text x="450" y="602" fill="#8899bb" font-size="13">Fewer Errors</text>
  <text x="580" y="602" fill="#bb77ff" font-size="16" font-weight="800">5.6x</text>
  <text x="625" y="602" fill="#8899bb" font-size="13">Faster (P95)</text>
  <text x="740" y="602" fill="#ffcc44" font-size="16" font-weight="800">0</text>
  <text x="760" y="602" fill="#8899bb" font-size="13">Overselling</text>

  <!-- Footer -->
  <text x="450" y="656" text-anchor="middle" fill="#555577" font-size="11">Both versions sold all 10,000 stock (DB verified) | v1 server processed purchases but responded too slowly for k6</text>
  <text x="450" y="676" text-anchor="middle" fill="#555577" font-size="11">v1: PostgreSQL only (row lock serialization) | v2: Redis hot path + async DB writes + in-memory cache</text>

  <!-- Correctness badge -->
  <rect x="310" y="690" width="280" height="24" rx="4" fill="#1a3a1a" stroke="#2a5a2a" stroke-width="1"/>
  <text x="450" y="707" text-anchor="middle" fill="#66cc66" font-size="12" font-weight="700">Both Correct: 10,000 sold, 0 oversold</text>
</svg>
